{% extends "layout.html" %}

{% block title %}User Login - ACMS{% endblock %}

{% block content %}
<div class="form-container">
    <div class="glass-form login-form">
        <div class="form-header">
            <i class="fas fa-user-circle"></i>
            <h2>User Login</h2>
        </div>
        <form action="{{ url_for('user_login') }}" method="POST">
            <div class="form-group">
                <label>User ID</label>
                <input type="text" name="user_id" placeholder="Enter your User ID" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-submit">Login</button>
        </form>
        <p class="form-footer">New user? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</div>
{% endblock %}
