{% extends "layout.html" %}

{% block title %}Register - ACMS{% endblock %}

{% block content %}
<div class="form-container">
    <div class="glass-form">
        <h2>User Registration</h2>
        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name</label>
                <input type="text" name="full_name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-id-badge"></i> User ID</label>
                <input type="text" name="user_id" placeholder="Create a unique ID" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" placeholder="example@mail.com" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" placeholder="Create a password" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-check-circle"></i> Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm your password" required>
            </div>
            <button type="submit" class="btn btn-submit">Register Now</button>
        </form>
        <p class="form-footer">Already have an account? <a href="{{ url_for('user_login') }}">Login here</a></p>
    </div>
</div>
{% endblock %}
